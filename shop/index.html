<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop | MeShop</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <div class="brand">
            <a href="../index.html">MeShop.</a>
        </div>

        <div class="nav-items">
            <a href="../index.html">Home</a>
            <a href="../login/index.html">Login</a>
            <a href="../signup/index.html">Signup</a>
            <a href="../cart/index.html">My Cart</a>
        </div>
    </nav>

    <main>

        <!-- SIDEBAR -->
        <aside>
            <section>
                <title>Colors</title>
                <ul>
                    <li><input type="checkbox" /> <label>Red</label></li>
                    <li><input type="checkbox" /> <label>Blue</label></li>
                    <li><input type="checkbox" /> <label>Green</label></li>
                    <li><input type="checkbox" /> <label>Black</label></li>
                    <li><input type="checkbox" /> <label>White</label></li>
                </ul>
            </section>

            <section>
                <title>Sizes</title>
                <ul>
                    <li><input type="checkbox" /> <label>S</label></li>
                    <li><input type="checkbox" /> <label>M</label></li>
                    <li><input type="checkbox" /> <label>L</label></li>
                    <li><input type="checkbox" /> <label>XL</label></li>
                </ul>
            </section>

            <section>
                <title>Rating</title>
                <input type="range" min="0" max="5" id="range" />
            </section>

            <section>
                <title>Price Range</title>
                <ul>
                    <li><input type="checkbox" /> <label>$0 - $25</label></li>
                    <li><input type="checkbox" /> <label>$25 - $50</label></li>
                    <li><input type="checkbox" /> <label>$50 - $100</label></li>
                    <li><input type="checkbox" /> <label>$100 onwards</label></li>
                </ul>
            </section>
        </aside>

        <!-- MAIN SHOP CONTENT -->
        <main-content>

            <!-- SEARCH BOX -->
            <input type="text" id="search" placeholder="Search" />

            <!-- FILTER BUTTONS -->
            <div class="filters">
                <div class="filter active filter-category" value="">All</div>
                <div class="filter filter-category" value="men's clothing">Mens</div>
                <div class="filter filter-category" value="women's clothing">Womens</div>
                <div class="filter filter-category" value="jewelery">Jewellery</div>
                <div class="filter filter-category" value="electronics">Electronics</div>
            </div>

            <!-- PRODUCTS LIST -->
            <section>
                <title>Products</title>
                <div id="products" class="items"></div>
            </section>

        </main-content>
    </main>

    <script src="script.js"></script>
</body>

</html>
