<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop | MeShop</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <nav>
        <div class="brand">
            <a href="../index.html">MeShop.</a>
        </div>

        <div class="nav-items">
            <a href="../index.html">Home</a>
            <a href="../login/index.html">Login</a>
            <a href="../signup/index.html">Signup</a>
            <a href="../cart/index.html">My Cart</a>
        </div>
    </nav>

    <main>

        <!-- SIDEBAR -->
        <aside>
            <section>
                <h3>Colors</h3>
                <ul>
                    <li><input type="checkbox" class="color-filter" value="red"> Red</li>
                    <li><input type="checkbox" class="color-filter" value="blue"> Blue</li>
                    <li><input type="checkbox" class="color-filter" value="green"> Green</li>
                    <li><input type="checkbox" class="color-filter" value="black"> Black</li>
                    <li><input type="checkbox" class="color-filter" value="white"> White</li>
                </ul>
            </section>

            <section>
                <h3>Sizes</h3>
                <ul>
                    <li><input type="checkbox" class="size-filter" value="S"> S</li>
                    <li><input type="checkbox" class="size-filter" value="M"> M</li>
                    <li><input type="checkbox" class="size-filter" value="L"> L</li>
                    <li><input type="checkbox" class="size-filter" value="XL"> XL</li>
                </ul>
            </section>

            <section>
                <h3>Rating</h3>
                <input type="range" min="0" max="5" id="rating-range" />
            </section>

            <section>
                <h3>Price Range</h3>
                <ul>
                    <li><input type="checkbox" class="price-filter" value="0-25"> $0 - $25</li>
                    <li><input type="checkbox" class="price-filter" value="25-50"> $25 - $50</li>
                    <li><input type="checkbox" class="price-filter" value="50-100"> $50 - $100</li>
                    <li><input type="checkbox" class="price-filter" value="100+"> $100 onwards</li>
                </ul>
            </section>

            <!-- APPLY BUTTON inside the sidebar -->
            <section class="apply-btn-section">
                <button id="apply-filters">Apply Filters</button>
            </section>
        </aside>

        <!-- MAIN CONTENT -->
        <main-content>

            <input type="text" id="search" placeholder="Search products..." />

            <div class="filters">
                <div class="filter active filter-category" value="">All</div>
                <div class="filter filter-category" value="men's clothing">Mens</div>
                <div class="filter filter-category" value="women's clothing">Womens</div>
                <div class="filter filter-category" value="jewelery">Jewellery</div>
                <div class="filter filter-category" value="electronics">Electronics</div>
            </div>

            <section>
                <h3>Products</h3>
                <div id="products" class="items"></div>
            </section>

        </main-content>

    </main>

    <script src="script.js"></script>
</body>

</html>
