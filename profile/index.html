<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <nav>
      <div class="brand"><a href="../index.html">MeShop.</a></div>
      <div class="nav-items">
        <a href="../index.html">Home</a>
        <a href="../login/index.html">Login</a>
        <a href="../signup/index.html">Signup</a>
        <a href="../cart/index.html">My Cart</a>
      </div>
    </nav>

    <div class="wrapper">

      <h2>My Profile</h2>

      <form id="profileForm" class="form-block">
        <input type="text" id="fname" placeholder="First Name" />
        <input type="text" id="lname" placeholder="Last Name" />

        <button type="submit" class="btn">Save Info</button>
      </form>

      <h2>Edit Password</h2>

      <form id="passwordForm" class="form-block">
        <input type="password" id="oldpass" placeholder="Old Password" />
        <input type="password" id="newpass" placeholder="New Password" />
        <input type="password" id="cnewpass" placeholder="Confirm New Password" />

        <button type="submit" class="btn">Change Password</button>
      </form>

      <script src="script.js"></script>

      <!-- put logout inside an actions container with same width as forms -->
      <div class="actions">
        <button class="btn logout">Logout</button>
      </div>

    </div>

  </body>
</html>
